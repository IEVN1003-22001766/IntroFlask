{% extends "layout.html" %}

{% block container %}

<form action="/distancia" method="post">

    <label>Punto 1</label>
    <div class="mb-3">
        <label for="x1" class="form-label">coordenada X:</label>
        <input type="number" class="form-control" id="x1" name="x1" value="x1">
    </div>
    <div class="mb-3">
        <label for="y1" class="form-label">coordenada Y:</label>
        <input type="number" class="form-control" id="y1" name="y1" value="y1">
    </div>

    <label class="mt-4">Punto 2</label>
    <div class="mb-3">
        <label for="x2" class="form-label">coordenada X:</label>
        <input type="number" class="form-control" id="x2" name="x2" value="x2">
    </div>
    <div class="mb-3">
        <label for="y2" class="form-label">coordenada Y:</label>
        <input type="number" class="form-control" id="y2" name="y2" value="y2">
    </div>


    <button type="submit" class="btn btn-primary">Calcular</button>
</form>

<h3>
    Resultado: {{ "%.2f" | format(res) }}
</h3>


{% endblock %}
